pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=decisions:1m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=reranking:1m rate=100r/s;
    limit_req_status 429;
    proxy_read_timeout 300s;
    proxy_connect_timeout 5s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 30881;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend jeva:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8082;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend clef:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8083;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend nox:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8084;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend intern:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8085;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend laya:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8086;
        client_max_body_size 1m;
        location / {
            limit_req zone=reranking burst=64 nodelay;
            proxy_read_timeout 300s;
            set $backend qwen:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8087;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend d3-mini:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8088;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend d3-flash:8000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8089;
        location / {
            limit_req zone=decisions burst=64 nodelay;
            set $backend d3-edge:8000;
            proxy_pass http://$backend;
        }
    }
}
